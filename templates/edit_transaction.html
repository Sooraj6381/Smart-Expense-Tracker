
{% extends "base.html" %}

{% block title %}Edit Transaction | Smart Expense Tracker{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="panel-card transaction-form-card">

                <p class="eyebrow mb-2">MONEY ACTIVITY</p>

                <h1 class="page-title mb-2">
                    Edit Transaction
                </h1>

                <p class="text-secondary mb-4">
                    Update your income or expense details.
                </p>


                <form method="POST"
                      action="{{ url_for('edit_transaction', transaction_id=transaction.id) }}">

                    <input type="hidden"
                           name="csrf_token"
                           value="{{ csrf_token() }}">


                    <div class="mb-3">

                        <label class="form-label">Description</label>

                        <input
                            type="text"
                            name="description"
                            class="form-control"
                            maxlength="200"
                            value="{{ transaction.description }}"
                            placeholder="Enter transaction description"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">Amount (₹)</label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            min="0.01"
                            step="0.01"
                            value="{{ transaction.amount }}"
                            placeholder="Enter amount"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">Transaction Type</label>

                        <select name="type" class="form-select" required>

                            <option value="income"
                                {% if transaction.type == 'income' %}selected{% endif %}>
                                Income
                            </option>

                            <option value="expense"
                                {% if transaction.type == 'expense' %}selected{% endif %}>
                                Expense
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">Category</label>

                        <select name="category" class="form-select" required>

                            {% for category in [
                                'Salary', 'Food', 'Travel', 'Shopping',
                                'Bills', 'Education', 'Health', 'Other'
                            ] %}

                            <option value="{{ category }}"
                                {% if transaction.category == category %}selected{% endif %}>
                                {{ category }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">Date</label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                            value="{{ transaction.date.strftime('%Y-%m-%d') }}"
                            required
                        >

                    </div>


                    <div class="d-flex flex-wrap gap-2">

                        <button type="submit" class="btn btn-primary">
                            Update Transaction
                        </button>

                        <a href="{{ url_for('transactions') }}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
