
{% extends "base.html" %}

{% block title %}Login | Smart Expense Tracker{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">SET</div>

            <p class="eyebrow">SMART EXPENSE TRACKER</p>

            <h2>Welcome Back!</h2>

            <p class="text-secondary">
                Login to manage your income and expenses.
            </p>

        </div>

        <form method="POST" action="{{ url_for('login') }}">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="d-grid mt-4">

                <button type="submit" class="btn btn-primary auth-submit">
                    Login to Account
                </button>

            </div>

        </form>

        <div class="auth-footer">

            <p class="mb-0">
                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create account
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
