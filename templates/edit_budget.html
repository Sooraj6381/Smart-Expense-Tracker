
{% extends "base.html" %}

{% block title %}Edit Budget{% endblock %}

{% block content %}

<p class="eyebrow">SPENDING PLAN</p>

<h1 class="page-title">Edit budget</h1>

<p class="text-secondary">
    Update your monthly spending limit.
</p>

<div class="row mt-3">
    <div class="col-lg-6">
        <div class="panel-card">

            <h5>Update budget details</h5>

            <form method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        value="{{ budget.category }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Monthly limit (₹)</label>
                    <input
                        type="number"
                        name="limit"
                        class="form-control"
                        value="{{ budget.limit }}"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Budget
                </button>

                <a href="{{ url_for('budgets') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>
</div>

{% endblock %}
