
{% extends "base.html" %}

{% block title %}Add Transaction | Smart Expense Tracker{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="panel-card transaction-form-card">

                <p class="eyebrow mb-2">MONEY ACTIVITY</p>

                <h1 class="page-title mb-2">
                    Add Transaction
                </h1>

                <p class="text-secondary mb-4">
                    Record your income or expenses.
                </p>


                <form method="POST"
                      action="{{ url_for('add_transaction') }}">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >


                    <!-- Description -->
                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <input
                            type="text"
                            name="description"
                            class="form-control"
                            placeholder="Example: Monthly salary"
                            maxlength="200"
                            required
                        >

                    </div>


                    <!-- Amount -->
                    <div class="mb-3">

                        <label class="form-label">
                            Amount (₹)
                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            placeholder="Enter amount"
                            min="0.01"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- Transaction Type -->
                    <div class="mb-3">

                        <label class="form-label">
                            Transaction Type
                        </label>

                        <select
                            name="type"
                            class="form-select"
                            required
                        >

                            <option value="">Select type</option>

                            <option value="income">
                                Income
                            </option>

                            <option value="expense">
                                Expense
                            </option>

                        </select>

                    </div>


                    <!-- Category -->
                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required
                        >

                            <option value="">Select category</option>

                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Education">Education</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>


                    <!-- Date -->
                    <div class="mb-4">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Buttons -->
                    <div class="d-flex flex-wrap gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Transaction
                        </button>

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
